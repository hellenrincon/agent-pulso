<title>Centro de mando PULSO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Caveat:wght@500;600&display=swap">
<style>
/* Layout: menú lateral fijo (barra inferior en celular), selector de proyecto arriba del menú; secciones apiladas, esquinas rectas y mucho aire */
:root {
  --vino: #5A1A28; --crema: #F3E8D6; --cafe: #5B3522; --oliva: #4A4B25; --petroleo: #17293A; --dorado: #B8913F;
  --bg: #F3E8D6; --panel: #FBF5EA; --ink: #17293A; --ink-2: #5B3522; --muted: #7d6a5c; --line: #e2d3bb;
  --accent: #5A1A28; --accent-ink: #F3E8D6; --gold: #B8913F;
  --verde: #4F7A3A; --amarillo: #C9A227; --rojo: #A8322D;
  --run: #4A4B25; --ride: #5B3522; --swim: #17293A; --cafe-pilar: #5A1A28;
  --f-title: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --f-hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121f2c; --panel: #17293A; --ink: #F3E8D6; --ink-2: #e2cfb3; --muted: #a9a08f; --line: #2c4053;
  --accent: #c9566d; --accent-ink: #121f2c; --gold: #d0ab5c;
  --run: #8f9150; --ride: #a3714f; --swim: #5f8fb5; --cafe-pilar: #c9566d; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121f2c; --panel: #17293A; --ink: #F3E8D6; --ink-2: #e2cfb3; --muted: #a9a08f; --line: #2c4053;
  --accent: #c9566d; --accent-ink: #121f2c; --gold: #d0ab5c;
  --run: #8f9150; --ride: #a3714f; --swim: #5f8fb5; --cafe-pilar: #c9566d; color-scheme: dark }

* { box-sizing: border-box; border-radius: 0 }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-title); font-weight: 300; text-transform: uppercase; letter-spacing: .22em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.05rem; color: var(--ink); }
h3 { font-size: .8rem; letter-spacing: .18em; font-weight: 500; }
.eyebrow { font-size: .68rem; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.hand { font-family: var(--f-hand); font-size: 1.6rem; line-height: 1.1; color: var(--accent); }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Armazón: menú lateral fijo con selector de proyecto; en celular, barra inferior de 5 opciones */
.shell { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.main-col { min-width: 0; display: flex; flex-direction: column; }
.main-col main { flex: 1; }
aside.side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--petroleo); color: #F3E8D6; display: flex; flex-direction: column; padding: max(18px, env(safe-area-inset-top, 0px)) 0 18px; padding-left: env(safe-area-inset-left, 0px); scrollbar-width: thin; }
.proj { display: flex; gap: 12px; align-items: center; margin: 0 14px; padding: 10px; background: rgba(243,232,214,.06); border: 1px solid rgba(243,232,214,.16); color: inherit; text-align: left; width: calc(100% - 28px); }
.proj:hover { border-color: var(--dorado); }
.brand-name { font-family: var(--f-title); font-weight: 300; letter-spacing: .36em; font-size: 1.05rem; line-height: 1; }
.brand-sub { font-size: .55rem; letter-spacing: .26em; opacity: .8; margin-top: 5px; }
.proj .chev { margin-left: auto; opacity: .7; font-size: .7rem; }
.proj-lbl { font-size: .58rem; letter-spacing: .2em; text-transform: uppercase; opacity: .6; margin: 0 24px 6px; }
.pulse-band { display: block; width: 100%; height: 22px; margin: 6px 0 10px; }
nav.menu { display: grid; gap: 2px; padding: 0 8px; }
nav.menu button { display: flex; align-items: center; gap: 12px; background: none; border: 0; border-left: 2px solid transparent; color: #F3E8D6; opacity: .78; padding: 10px 12px; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; text-align: left; width: 100%; }
nav.menu button:hover { opacity: 1; background: rgba(243,232,214,.06); }
nav.menu button[aria-current="page"] { opacity: 1; border-left-color: var(--dorado); background: rgba(243,232,214,.09); font-weight: 600; }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
nav.menu .badge { margin-left: auto; }
.badge { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 6px; background: var(--dorado); color: var(--petroleo); font-weight: 600; letter-spacing: 0; text-align: center; font-size: .66rem; line-height: 1.5; }
.side-foot { margin-top: auto; padding: 18px 22px 0; font-size: .62rem; letter-spacing: .14em; text-transform: uppercase; opacity: .7; display: grid; gap: 4px; }
.mtop { display: none; }
nav.bottom { display: none; }
.scrim { position: fixed; inset: 0; background: rgba(10,18,26,.5); z-index: 29; }
.topbar { display: flex; align-items: baseline; gap: 10px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--ink); padding-bottom: 12px; }
.topbar h1 { font-size: 1.3rem; letter-spacing: .24em; }
.topbar .eyebrow { margin-left: auto; }
.back { background: none; border: 0; padding: 0; color: var(--accent); font-size: .7rem; letter-spacing: .16em; text-transform: uppercase; width: 100%; text-align: left; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--petroleo); }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  aside.side { display: none; }
  aside.side.open { display: flex; position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); height: 100%; z-index: 30; }
  .mtop { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--petroleo); color: #F3E8D6; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border: 0; width: 100%; text-align: left; }
  .mtop .chev { margin-left: auto; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; opacity: .75; }
  nav.bottom { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--petroleo); padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); border-top: 1px solid rgba(243,232,214,.14); }
  nav.bottom button { position: relative; background: none; border: 0; border-top: 2px solid transparent; color: #F3E8D6; opacity: .75; display: grid; justify-items: center; gap: 3px; padding: 9px 2px 8px; font-size: .56rem; letter-spacing: .1em; text-transform: uppercase; }
  nav.bottom button[aria-current="page"] { opacity: 1; border-top-color: var(--dorado); font-weight: 600; }
  nav.bottom .badge { position: absolute; top: 4px; left: 56%; margin: 0; font-size: .55rem; }
  main .wrap { padding-bottom: 120px !important; }
  footer { padding-bottom: 70px; }
  .toast { bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
  .topbar .eyebrow { margin-left: 0; width: 100%; }
  .acceso { padding: 14px; } .acceso .v { font-size: 1.7rem; }
}
/* Piezas nuevas */
.accesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); border: 1px solid var(--line); background: var(--panel); }
.acceso { background: none; border: 0; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 18px 20px; display: grid; gap: 6px; text-align: left; color: inherit; align-content: start; }
.acceso:hover { background: var(--bg); }
.acceso .v { font-family: var(--f-title); font-weight: 300; font-size: 2.2rem; line-height: 1; color: var(--gold); font-variant-numeric: tabular-nums; }
.acceso .l { font-size: .84rem; color: var(--ink-2); }
.acceso .go { font-size: .64rem; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
.subtabs { display: flex; gap: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
.subtabs button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 10px 16px; font-size: .68rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.subtabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
.filtros label { display: grid; gap: 4px; font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
.filtros select, .filtros input { font: inherit; font-size: .86rem; padding: 8px 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); min-width: 150px; text-transform: none; letter-spacing: 0; }
.hday { display: grid; gap: 0; }
.hday h3 { padding: 14px 0 6px; color: var(--muted); }
.hrow { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
.hrow .hh { white-space: nowrap; font-size: .74rem; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 3px; }
.hrow .ht { font-weight: 500; }
.hrow .hb { display: grid; gap: 4px; min-width: 0; }
.hrow .hact { display: grid; gap: 6px; justify-items: end; }
.hrow .hact .btn { padding: 6px 10px; }
@media (max-width: 560px) { .hrow { grid-template-columns: minmax(0, 1fr); gap: 6px; } .hrow .hact { justify-items: start; grid-auto-flow: column; } }
.swatches { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); border: 1px solid var(--line); }
.sw { display: grid; gap: 4px; align-content: end; min-height: 120px; padding: 14px; font-size: .74rem; }
.sw b { font-family: var(--f-title); font-weight: 500; text-transform: uppercase; letter-spacing: .14em; font-size: .72rem; }
.tree { background: var(--panel); border: 1px solid var(--line); padding: 16px 18px; font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size: .8rem; line-height: 1.7; overflow-x: auto; white-space: pre; margin: 0; }
/* Branding board: tablero visual de la marca (colores reales de la marca, no cambian con el tema) */
.board { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
.bt { position: relative; border: 1px solid var(--line); overflow: hidden; display: grid; place-items: center; min-height: 160px; padding: 34px 18px 18px; }
.bt > .bl { position: absolute; left: 14px; top: 12px; font-size: .6rem; letter-spacing: .24em; text-transform: uppercase; font-weight: 600; opacity: .7; }
.bt img.bimg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: inherit; }
.b-logo { grid-column: span 8; aspect-ratio: 16 / 9; background: #F3E8D6; color: #5A1A28; }
.b-sub { grid-column: span 4; background: #17293A; color: #F3E8D6; }
.b-cols { grid-column: span 12; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
.b-col { border: 1px solid var(--line); aspect-ratio: 1 / 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: 12px; font-size: .72rem; }
.b-col b { font-family: var(--f-title); font-weight: 500; text-transform: uppercase; letter-spacing: .14em; font-size: .66rem; }
.b-sec { grid-column: span 4; background: #FBF5EA; color: #5A1A28; }
.b-tipo { grid-column: span 8; background: #FBF5EA; color: #17293A; place-items: stretch; }
.b-m1 { grid-column: span 8; aspect-ratio: 16 / 11; background: #F3E8D6; color: #5A1A28; padding: 0; }
.b-m2 { grid-column: span 4; background: #E9E4DA; color: #17293A; padding: 0; }
.b-m1 svg, .b-m2 svg { width: 100%; height: 100%; display: block; }
.bw { font-family: var(--f-title); font-weight: 300; letter-spacing: .42em; font-size: clamp(1.6rem, 4vw, 3rem); line-height: 1; padding-left: .42em; }
.bs { font-size: clamp(.55rem, 1.2vw, .78rem); letter-spacing: .4em; margin-top: 10px; text-align: center; }
.tipo-in { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; width: 100%; }
.tipo-aa { font-family: var(--f-title); font-weight: 300; font-size: clamp(3.4rem, 8vw, 6rem); line-height: 1; color: #5A1A28; }
.tipo-l { display: grid; gap: 10px; min-width: 0; }
.tipo-l span { display: block; overflow-wrap: anywhere; }
.pil { display: flex; gap: 14px; justify-content: center; }
.pil span { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-size: .58rem; letter-spacing: .16em; font-weight: 600; color: #F3E8D6; border: 1px solid rgba(243,232,214,.5); }
@media (max-width: 760px) {
  .b-logo, .b-sub, .b-sec, .b-tipo, .b-m1, .b-m2 { grid-column: span 12; }
  .b-cols { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .b-sub, .b-sec { min-height: 190px; }
  .b-m2 { aspect-ratio: 4 / 5; }
  .tipo-in { grid-template-columns: minmax(0, 1fr); gap: 12px; }
}
/* Manual de marca (páginas de Canva en grande) con revisión por página */
.manual { display: grid; gap: 28px; }
.mcmp-w{display:grid;gap:14px;overflow-x:auto}.mcmp{display:grid;grid-template-columns:110px repeat(var(--nv),minmax(200px,1fr));gap:12px;align-items:start}.mcmp-h>div{display:grid;gap:4px;align-content:start;font-size:.88rem}.mcmp-n{display:grid;gap:4px;font-size:.8rem;color:var(--ink-2)}.mcmp img{width:100%;display:block;border-radius:6px}.alc{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:.86rem;margin:6px 0}.alc label{display:flex;gap:6px;align-items:center}@media(max-width:640px){.mcmp{grid-template-columns:repeat(var(--nv),minmax(130px,1fr))}.mcmp-n{grid-column:1/-1;grid-auto-flow:column;justify-content:start}.mcmp-h>span{display:none}}
.mopc { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.mopc figure { margin: 0; display: grid; gap: 8px; align-content: start; }
.mopc figcaption { font-size: .82rem; }
.mopc .btn { justify-self: start; }
.mpage { display: grid; gap: 10px; }
.mpage-h { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.mpage-h .n { font-family: var(--f-title); font-weight: 300; font-size: 1.6rem; color: var(--gold); line-height: 1; }
.mpage-h .t { font-family: var(--f-title); text-transform: uppercase; letter-spacing: .14em; font-weight: 500; font-size: .82rem; }
.mpage-h .chip { margin-left: auto; }
.mpage a.mimg { display: block; border: 1px solid var(--line); background: var(--panel); }
.mpage a.mimg img { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: contain; }
.mpage .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.mpage textarea, .mhist textarea { min-height: 56px; }
.mcom { font-size: .84rem; color: var(--ink-2); border-left: 2px solid var(--line); padding-left: 10px; }
.mhist { display: grid; gap: 0; border-top: 1px solid var(--ink); }
.mh { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.mh .w { font-size: .72rem; color: var(--muted); }
@media (max-width: 560px) { .mh { grid-template-columns: minmax(0, 1fr); gap: 4px; } }
.reglas { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: .9rem; }
.ajuste { background: var(--panel); border: 1px solid var(--line); padding: 18px; display: grid; gap: 10px; align-content: start; }
.ajuste .pt { font-family: var(--f-title); text-transform: uppercase; letter-spacing: .12em; font-weight: 500; font-size: .8rem; }
.seg { display: flex; flex-wrap: wrap; gap: 0; }
.seg button { border: 1px solid var(--line); background: var(--bg); color: var(--ink-2); padding: 8px 14px; font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; margin-right: -1px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.ajustes-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; }

main .wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 56px; padding-block: 36px 80px; }
section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; scroll-margin-top: 64px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.sec-head .eyebrow { margin-left: auto; }
.empty { border: 1px dashed var(--line); padding: 22px; color: var(--muted); font-size: .9rem; }
.empty strong { color: var(--ink); font-weight: 500; }
.src { font-size: .7rem; color: var(--muted); }
.ro-note { background: var(--panel); border-left: 3px solid var(--gold); padding: 10px 14px; font-size: .85rem; }

/* Chips */
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: .62rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 600; padding: 3px 8px; border: 1px solid currentColor; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot.verde { background: var(--verde) } .dot.amarillo { background: var(--amarillo) } .dot.rojo { background: var(--rojo) } .dot.gris { background: var(--line) }
.agent { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 500; }
.mono { width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: .6rem; font-weight: 600; letter-spacing: .04em; color: #F3E8D6; background: var(--ag, var(--petroleo)); flex: none; }

/* Semana del Estratega */
.semana { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0; border: 1px solid var(--line); background: var(--panel); }
.prio { padding: 22px; display: grid; gap: 10px; align-content: start; border-right: 1px solid var(--line); min-width: 0; }
.prio:last-child { border-right: 0; }
.prio .n { font-family: var(--f-title); font-weight: 300; font-size: 2.6rem; line-height: 1; color: var(--gold); }
.prio .t { font-family: var(--f-title); font-weight: 500; text-transform: uppercase; letter-spacing: .1em; font-size: .9rem; }
.prio .meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: .75rem; color: var(--muted); }
.semana-foot { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; justify-content: space-between; }

/* Decisiones */
.decisiones { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 20px; }
.dcard { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--accent); display: grid; gap: 14px; padding: 20px; align-content: start; min-width: 0; }
.dcard.hecha { border-top-color: var(--line); opacity: .85; }
.dcard .d-top { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.dcard .d-title { font-weight: 600; font-size: 1.02rem; line-height: 1.35; }
.dcard .d-prop { color: var(--ink-2); font-size: .9rem; white-space: pre-line; }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); background: var(--bg); cursor: pointer; }
.opt input { margin-top: 4px; accent-color: var(--accent); }
.opt.rec { border-color: var(--gold); }
.opt .o-t { font-weight: 500; font-size: .88rem; }
.opt .o-d { font-size: .78rem; color: var(--muted); }
.rec-tag { font-size: .6rem; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); font-weight: 600; margin-left: 6px; }
.porque { font-size: .82rem; border-left: 2px solid var(--gold); padding-left: 10px; color: var(--ink-2); }
.visual-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--petroleo); color: #F3E8D6; text-decoration: none; font-size: .8rem; letter-spacing: .08em; }
.visual-link:hover { background: var(--vino); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: transparent; color: var(--ink); padding: 9px 14px; font-size: .68rem; letter-spacing: .2em; text-transform: uppercase; font-weight: 600; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
textarea { width: 100%; min-height: 72px; font: inherit; font-size: .88rem; padding: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
.answer { font-size: .82rem; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); }

  function decCard(d, live) {

  }

  function decisionesHTML(id) {
    const all = S.decisiones.filter((d) => !id || d.agente === id);

    const perfil = `<div class="perfil"><div class="pgrid" aria-label="Así se vería el perfil">${tiles}</div>
      <div class="bio"><strong>PULSO Coffee &amp; More | Bogotá</strong><span>Café para gente en movimiento</span><span>RUN • RIDE • SWIM</span><span>Bogotá · Próximamente</span><span class="pc">Enlace a la lista de espera: por confirmar</span>
      <span class="hand" style="margin-top:10px">Los descartados desaparecen del perfil</span>
      ${safeUrl(p.lienzo) ? `<a class="visual-link" href="${esc(p.lienzo)}" target="_blank" rel="noopener" style="margin-top:10px">Editar los diseños en Claude Design</a>` : ""}</div></div>`;
    return sec("Revisión de posts", "Un post a la vez: aprueba, pide un cambio o descarta", review) + sec("Así se vería tu perfil", "Se actualiza con lo que apruebas", perfil);

  function revisionBanner() {

  }
  function estrategiaHTML() {
    const e = S.estrategia; if (!e) return "";

    const pal = (e.palancas || []).map((p) => `<div class="palanca"><div class="pt">${esc(p.titulo)}</div><div class="pd">${esc(p.detalle)}</div><div class="meta" style="display:flex;gap:8px;flex-wrap:wrap"><span class="chip" style="color:var(--ink-2)">${esc(p.tiempo)}</span><span class="chip" style="color:var(--verde)">${esc(p.costo)}</span></div></div>`).join("");

      ${e.frase ? `<div class="hand">${esc(e.frase)}</div>` : ""}

  /* ---------- Menú lateral, pantallas y proyectos ---------- */
  const IC = {
    inicio: '<path d="M3 11 L12 4 L21 11 V20 H3 Z M9 20 V14 H15 V20"/>',

  const ico = (k) => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${IC[k] || ""}</svg>`;
  const pendTotal = () => pendingOf().length + S.propuestas.filter((x) => !revOf(x)).length;
  const badgeOf = (k) => { const n = k === "decisiones" ? pendTotal() : k === "crear" ? S.propuestas.filter((x) => !revOf(x)).length : 0; return n ? `<span class="badge">${n}</span>` : ""; };
  const curMenu = () => tab.startsWith("ag-") ? "agentes" : tab;
  function renderNav() {
    $("menu").innerHTML = MENU.map(([k, l]) => `<button data-tab="${k}" ${curMenu() === k ? 'aria-current="page"' : ""}>${ico(k)}<span>${esc(l)}</span>${badgeOf(k)}</button>`).join("");
    const masOn = !["inicio", "decisiones", "crear", "ventas"].includes(curMenu());
    $("bottom").innerHTML = [["inicio", "Inicio"], ["decisiones", "Decisiones"], ["crear", "Crear"], ["ventas", "Pedidos"]].map(([k, l]) => `<button data-tab="${k}" ${curMenu() === k ? 'aria-current="page"' : ""}>${ico(k)}<span>${l}</span>${badgeOf(k)}</button>`).join("")

  function drawer(open) { $("side").classList.toggle("open", !!open); $("scrim").hidden = !open; }

  const TITULOS = { inicio: ["Hoy en " + proyecto.corto, ""], decisiones: ["Decisiones", "Pendientes e historial guardado"], crear: ["Crear", "De tu pedido a la biblioteca del proyecto"], calendario: ["Calendario", "Qué sale y cuándo"], ventas: ["Ventas y pedidos", "Cupos, pedidos y números"], producto: ["Menú y producto", "Bebidas, recetas y proveedores"], eventos: ["Eventos", "Carreras, ciclovías y alianzas"], agentes: ["Agentes", "Quién hace qué"], marca: ["Marca y conocimiento", "La carpeta de " + proyecto.corto + " y su independencia"], ajustes: ["Ajustes", "Tema, conexiones y topes"], proyectos: ["Mis proyectos", "Cada proyecto con su marca, datos y agentes"] };
  function topbarHTML() {
    if (tab.startsWith("ag-")) { const id = tab.slice(3); return `<button class="back" data-tab="agentes">← Agentes</button><h1>${esc(info(id).n)}</h1><span class="eyebrow">Agente de ${esc(proyecto.corto)}</span>`; }

  // Inicio: 4 accesos rápidos, decisiones pendientes, cupos del día y agentes activos
  function inicioHTML() {
    const pend = pendingOf().length, posts = S.propuestas.filter((x) => !revOf(x)).length;
    const hoy = hoyYMD(); const en7 = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date(Date.now() + 7 * 864e5));
    const prox = S.calendario.filter((c) => String(c.fecha) >= hoy && String(c.fecha) <= en7).length;
    const c = S.cupos.find((x) => x._id === hoy); const ped = c && typeof c.vendidos === "number" ? c.vendidos : null;
    const acc = (k, v, l, go) => `<button class="acceso" data-tab="${k}"><span class="eyebrow">${ico(k)}</span><span class="v">${v}</span><span class="l">${esc(l)}</span><span class="go">${esc(go)} →</span></button>`;
    const pc4 = pendingOf().sort((a, b) => String(a.creada).localeCompare(String(b.creada)));
    const decs = revisionBanner() + (pc4.length ? `<div class="decisiones">${pc4.slice(0, 2).map((d) => decCard(d, canWrite)).join("")}</div>${pc4.length > 2 ? `<button class="btn" data-tab="decisiones" style="justify-self:start">Ver las ${pc4.length} decisiones</button>` : ""}` : posts ? "" : empty("No hay decisiones esperando.", "Cuando un agente necesite tu aprobación, su tarjeta aparece aquí."));
    return `<div class="accesos">${acc("decisiones", pend, pend === 1 ? "decisión espera tu respuesta" : "decisiones esperan tu respuesta", "Responder")}${acc("crear", posts, posts === 1 ? "post por revisar" : "posts por revisar", "Revisar")}${acc("calendario", prox, "publicaciones en los próximos 7 días", "Ver calendario")}${acc("ventas", ped == null ? "—" : ped, ped == null ? "pedidos hoy · la web aún no abre" : "pedidos hoy", "Ver pedidos")}</div>`
      + sec("Decisiones pendientes", "Aprobar, comentar o rechazar", decs)
      + `<div class="menu-grid"><div>${sec("Agentes activos", "Toca uno para ver su trabajo", agentesHTML(true))}</div>${sec("Cupos del día", "", cupoHTML())}</div>`
      + sec("Actividad reciente", "Quién hizo qué y a quién lo pasó", feedHTML(null, 8));
  }

  // Decisiones: pestañas Pendientes / Historial
  let decTab = "pendientes", hAg = "", hRes = "", hDesde = "", hReabrir = null;
  const RES = { aprobada: ["verde", "Aprobada"], con_cambios: ["amarillo", "Con cambios"], rechazada: ["rojo", "Rechazada"], reabierta: ["gris", "Reabierta"] };
  const ymdTZ = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" }).format(d); };
  function decisionesScreen() {
    const tabs = `<div class="subtabs" role="tablist"><button role="tab" data-dectab="pendientes" aria-selected="${decTab === "pendientes"}">Pendientes${pendTotal() ? ` <span class="badge">${pendTotal()}</span>` : ""}</button><button role="tab" data-dectab="historial" aria-selected="${decTab === "historial"}">Historial · ${S.historial.length}</button></div>`;
    if (decTab === "historial") return `<section>${tabs}${historialHTML()}</section>`;
    const pend = pendingOf().sort((a, b) => String(a.creada).localeCompare(String(b.creada)));
    return `<section>${tabs}</section>` + sec("Esperan tu respuesta", "Cada respuesta queda guardada en el historial", revisionBanner() + (pend.length ? `<div class="decisiones">${pend.map((d) => decCard(d, canWrite)).join("")}</div>` : empty("No hay decisiones esperando.", "Las que ya respondiste están en Historial.")));
  }
  // La última entrada de cada pieza manda: solo esa se puede reabrir
  const ultimaDe = (ref) => S.historial.filter((x) => x.ref === ref).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)))[0];
  function historialHTML() {
    const all = S.historial.slice().sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
    const ags = Array.from(new Set(all.map((x) => x.agente).filter(Boolean)));
    const vis = all.filter((x) => (!hAg || x.agente === hAg) && (!hRes || x.resultado === hRes) && (!hDesde || ymdTZ(x.fecha) >= hDesde));
    const filtros = `<div class="filtros">
      <label>Agente<select id="h-ag"><option value="">Todos</option>${ags.map((a) => `<option value="${esc(a)}" ${a === hAg ? "selected" : ""}>${esc(info(a).n)}</option>`).join("")}</select></label>
      <label>Resultado<select id="h-res"><option value="">Todos</option>${Object.keys(RES).map((k) => `<option value="${k}" ${k === hRes ? "selected" : ""}>${RES[k][1]}</option>`).join("")}</select></label>
      <label>Desde<input type="date" id="h-desde" value="${esc(hDesde)}"></label>
      ${hAg || hRes || hDesde ? `<button class="btn" data-hlimpiar="1">Quitar filtros</button>` : ""}</div>`;
    if (!all.length) return filtros + empty("El historial está vacío.", "Cada vez que apruebas, comentas o rechazas algo, queda guardado aquí.");
    if (!vis.length) return filtros + empty("Nada con esos filtros.", "Prueba con otro agente, resultado o fecha.");
    const dias = []; vis.forEach((x) => { const k = ymdTZ(x.fecha); let g = dias.find((d) => d.k === k); if (!g) dias.push(g = { k, xs: [] }); g.xs.push(x); });
    const reabrible = (x) => {
      if (!canWrite || x.resultado === "reabierta" || ultimaDe(x.ref) !== x || (x.tipo !== "post" && x.tipo !== "decision")) return "";
      if (x.tipo === "post") { const p = S.propuestas.find((y) => y._id === x.ref); if (!p) return ""; if (p.metricool && p.metricool.fecha) return `<span class="src">Ya programado: se cambia en Metricool</span>`; if (!revOf(p)) return ""; }
      if (x.tipo === "decision") { const d = S.decisiones.find((y) => y._id === x.ref); if (!d || (d.estado || "pendiente") === "pendiente") return ""; }
      return hReabrir === x._id ? `<button class="btn primary" data-reabrir="${esc(x._id)}" data-ok="1">¿Reabrir? Sí</button><button class="btn" data-reabrir="">No</button>` : `<button class="btn" data-reabrir="${esc(x._id)}">Reabrir</button>`;

          <span class="ht">${x.tipo === "post" ? `<button class="back" style="width:auto;font-size:inherit;letter-spacing:0;text-transform:none;color:var(--ink);text-decoration:underline" data-tab="crear" data-rev="${esc(x.ref)}">${esc(x.titulo)}</button>` : esc(x.titulo)}</span>

          ${x.nota ? `<span style="font-size:.86rem;color:var(--ink-2)">“${esc(x.nota)}”</span>` : ""}</div>
        <div class="hact"><span class="chip" style="color:var(--ink-2)"><span class="dot ${r[0]}"></span>${esc(r[1])}</span>${reabrible(x)}</div></div>`; }).join("")}</div>`; }).join("");
  }

  // Crear: flujo de 5 pasos, revisión de posts, pedidos, biblioteca y herramientas creativas
  const PASOS = [["Pides", "Escribes qué necesitas o apruebas una idea del calendario."], ["El agente prepara", "Arma el encargo con la marca del proyecto activo."], ["La herramienta crea", "Hoy Canva; las demás cuando se conecten."], ["Tú apruebas", "Nada sale sin tu visto bueno."], ["Queda en la biblioteca", "La pieza aprobada se guarda en el proyecto."]];
  const HERR = [

    ["Mensajes directos", "Manychat", "", "Por confirmar. Sin conectar."]

  function herramientasHTML() {
    return `<div class="table-scroll"><table><thead><tr><th>Uso</th><th>Herramienta</th><th>Estado</th></tr></thead><tbody>${HERR.map((h) => `<tr><td>${esc(h[0])}</td><td style="font-weight:500">${esc(h[1])}</td><td><span class="chip" style="color:var(--ink-2)"><span class="dot ${h[2] ? "verde" : "gris"}"></span>${h[2] ? "Conectado" : "Por confirmar"}</span><div class="src">${esc(h[3])}</div></td></tr>`).join("")}</tbody></table></div>
      <ul class="reglas" style="font-size:.84rem;color:var(--ink-2)"><li>Las claves de API van solo en el servidor, nunca en el navegador ni en manos de los agentes.</li><li>Tope de gasto mensual por proyecto: <span class="pc">por confirmar</span>. Al llegar, el agente te pide permiso antes de seguir.</li><li>Las imágenes hechas con IA son para ambiente y fondos. No muestran un producto que no existe.</li><li>Nada se publica sin tu aprobación.</li></ul>`;

  function crearHTML() {
    return `<div class="fases">${PASOS.map((p, i) => `<div class="fase"><span class="fn">${i + 1}</span><span style="font-family:var(--f-title);text-transform:uppercase;letter-spacing:.12em;font-weight:500;font-size:.78rem">${esc(p[0])}</span><span class="src" style="font-size:.78rem">${esc(p[1])}</span></div>`).join("")}</div>`
      + propuestasHTML() + solicitudesHTML() + bibliotecaHTML() + piezasHTML("contenido")

  const linkBand = (t, k, l) => `<div class="off-band"><span>${esc(t)}</span><button class="btn" data-tab="${k}">${esc(l)} →</button></div>`;
  const SCREENS = {
    inicio: inicioHTML,
    decisiones: decisionesScreen,
    crear: crearHTML,
    calendario: () => sec("Calendario de publicación", "Fecha y hora propuestas · nada sale sin tu aprobación", calendarioHTML() + `<div class="src" style="margin-top:8px">Al aprobar un post, el agente lo programa en Metricool en esa fecha y hora. Si la fecha ya pasó, toma el siguiente espacio libre. Para cambiar una fecha, usa "Pedir cambio" en el post (sección Crear).</div>`),
    ventas: () => sec("Pedidos del día", "Cupos como barra de progreso", `<div class="menu-grid"><div>${empty("Todavía no hay pedidos.", "La web abre pedidos cuando apruebes bebidas, precios, cupo, entrega y medio de cobro.")}</div>${cupoHTML()}</div>`) + sec("Números clave", "Cada número con su fuente", numerosHTML()),
    producto: () => sec("Menú y costos", "Tabla con semáforo de margen", `<div class="menu-grid"><div>${menuHTML()}</div>${cupoHTML()}</div>`) + sec("Recetas", "Café, matcha y más · ingredientes y pasos", recetasHTML()) + sec("Proveedores", "Café de marca propia, matcha y empaques · cada dato con fuente", proveedoresHTML()),
    eventos: () => sec("Calendario de eventos", "Modo eventos · Bogotá y Cundinamarca", empty("Primera búsqueda pendiente.", "Aquí aparece cada carrera, evento ciclista, triatlón o ciclovía con semáforo, fuente y fecha de verificación, más su tarjeta: ir, no ir o contactar.")),
    agentes: () => sec("Los " + S.agentes.length + " agentes", "Toca uno para ver sus tareas, mensajes y actividad", agentesHTML()) + sec("Actividad reciente", "Quién hizo qué y a quién lo pasó", feedHTML(null, 20)),
    marca: marcaHTML,
    ajustes: ajustesHTML,
    proyectos: proyectosHTML
  };

  // Branding board: cada casilla se dibuja con la marca; si el agente Marca e identidad deja una imagen aprobada en marca/board, se muestra esa

  function proyectosHTML() {

  function agenteHTML(id) {

      producto: () => linkBand("Menú, recetas y proveedores están en Menú y producto.", "producto", "Ir a Menú y producto") + decs,

    html += (extra ? extra() : decs) + tareas + mensajesHTML(id) + sec("Actividad", "Lo que hizo y lo que le pasaron", feedHTML(id, 20));
    return html;
  }

  function renderAll() {
    renderNav();
    const scrollY = window.scrollY;
    const drafts = {}; document.querySelectorAll("textarea[id^='cm-'], textarea[id^='mc-'], #rev-cm, #med-desc, #sol-txt").forEach((t) => { if (t.value) drafts[t.id] = t.value; });

    if (!loaded) return;
    $("topbar").innerHTML = topbarHTML();
    $("panel").innerHTML = tab.startsWith("ag-") ? agenteHTML(tab.slice(3)) : (SCREENS[tab] || inicioHTML)();
    Object.keys(drafts).forEach((k) => { const t = $(k); if (t) t.value = drafts[k]; });
    Object.keys(sel).forEach((n) => { const r = document.querySelector(`input[name="${CSS.escape(n)}"][value="${CSS.escape(sel[n])}"]`); if (r) r.checked = true; });

  }
  function go(t) {
    t = norm(t); drawer(false);
    if (!t || t === tab) return;
    tab = t; try { localStorage.setItem("pulso-tab", t); } catch (e) {}
    try { history.replaceState(null, "", "#" + t); } catch (e) {}
    renderAll(); window.scrollTo(0, 0);
  }
  renderNav();

  /* ---------- Acciones de la fundadora ---------- */
  document.addEventListener("click", async (ev) => {
    if (ev.target.closest("#scrim")) { drawer(false); return; }
    if (ev.target.closest("[data-mas]")) { drawer(!$("side").classList.contains("open")); return; }
    const dt = ev.target.closest("[data-dectab]");
    if (dt) { decTab = dt.dataset.dectab; renderAll(); return; }
    const mcf = ev.target.closest("button[data-mconf]");
    if (mcf) { mConf = mcf.dataset.mconf; renderAll(); return; }
    const mt = ev.target.closest("[data-mtab]");
    if (mt) { mTab = mt.dataset.mtab; renderAll(); return; }
    if (ev.target.closest("[data-hlimpiar]")) { hAg = hRes = hDesde = ""; renderAll(); return; }
    const ts = ev.target.closest("[data-themeset]");
    if (ts) { const k = ts.dataset.themeset; if (k === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = k; try { localStorage.setItem("pulso-theme", k); } catch (e) {} renderAll(); return; }
    const pj = ev.target.closest("[data-proj]");
    if (pj) { const np = PROYECTOS.find((x) => x.id === pj.dataset.proj); if (np && np.id !== proyecto.id) { proyecto = np; location.reload(); return; } go("inicio"); return; }

    const rh = ev.target.closest("button[data-reabrir]");
    if (rh && db && canWrite && !busy) {
      const h = S.historial.find((x) => x._id === rh.dataset.reabrir);

      busy = true; const now = new Date().toISOString();
      try {
        if (h.tipo === "post") await D("propuestas/" + h.ref).update({ revision: null });
        else await D("decisiones/" + h.ref).update({ estado: "pendiente", respuesta: null, reabierta: now });
        await C("historial").doc().set({ fecha: now, proyecto: proyecto.id, agente: h.agente || null, tipo: h.tipo, ref: h.ref, titulo: h.titulo, resultado: "reabierta", nota: "", opcion: null, opcion_titulo: "", reabre: h._id, por: "fundadora" });

    }
    const mb2 = ev.target.closest("button[data-mact]");
    if (mb2 && db && canWrite && !busy) {
      const act = mb2.dataset.mact; const n = Number(mb2.dataset.mp) || 0; const m = S.manual || {};
      const pg = (m.paginas || []).find((p) => p.n === n);
      let txt = ((($("mc-" + n) || {}).value) || "").trim();
      const opc = mb2.dataset.mopc != null && pg && Array.isArray(pg.opciones) ? pg.opciones[Number(mb2.dataset.mopc)] : null;
      const vs = mVers(); const ver = mb2.dataset.mver != null ? vs[Number(mb2.dataset.mver)] : null;

      if (opc) txt = "Eligió la versión " + (opc.etiqueta || "") + (txt ? ". " + txt : "");
      if ((act === "cambios" || act === "comentario") && !txt) { toast(act === "cambios" ? "Escribe qué cambiarías en esta página." : "Escribe el comentario."); return; }
      busy = true; const now = new Date().toISOString();
      const titulo = alcance === "manual" && act !== "aprobado" && act !== "comentario" ? "Manual de marca completo" + (pg ? ` (pedido desde la página ${n})` : "") : pg ? `Manual de marca · página ${n}: ${pg.titulo || ""}` : "Manual de marca completo";
      try {
        await C("marca_comentarios").doc().set({ pagina: n || null, tipo: act === "version" ? "cambios" : act, alcance, texto: txt, por: "fundadora", fecha: now, version: m.version || 1, proyecto: proyecto.id });
        if (act !== "comentario") await C("historial").doc().set({ fecha: now, proyecto: proyecto.id, agente: "marca", tipo: "marca", ref: (alcance === "manual" && act !== "aprobado") || !pg ? "manual" : "manual-p" + n, titulo, resultado: act === "cambios" || act === "version" ? "con_cambios" : "aprobada", nota: txt, opcion: null, opcion_titulo: "", por: "fundadora" });
        if (act === "cambios" || act === "version") await C("solicitudes").doc().set({ tipo: "marca", agente: "marca", alcance, pagina: alcance === "manual" ? null : n, desde_pagina: n || null, version: ver ? ver.etiqueta : null, canva_id: (ver && ver.canva_id) || m.canva_id || null, texto: txt, estado: "pendiente", fecha: now });
        await C("actividad").doc().set({ agente: "fundadora", accion: `${{ aprobado: "Aprobó", cambios: "Pidió cambios en", comentario: "Comentó", version: "Eligió versión para", manual_aprobado: "Aprobó" }[act]} ${titulo}${txt ? ": " + txt : ""}`, pasa_a: "marca", fecha: now });
        if ($("mc-" + n)) $("mc-" + n).value = "";
        toast({ aprobado: "Página aprobada. Quedó en el historial.", version: "Listo. El agente aplica esa versión a todo el manual y te avisa aquí.", cambios: alcance === "manual" ? "Cambio enviado: se aplica a todas las páginas del manual." : "Cambio enviado al agente Marca e identidad.", comentario: "Comentario guardado.", manual_aprobado: "Manual aprobado. El agente actualiza la marca." }[act]);
      } catch (e) { toast("No se pudo guardar. Inténtalo de nuevo."); } finally { busy = false; renderAll(); }
      return;
    }
    const rb = ev.target.closest("[data-rev]");
    if (rb) { const rt = rb.dataset.tab && norm(rb.dataset.tab); if (rt && rt !== tab) { revId = rb.dataset.rev; go(rt); return; } revId = rb.dataset.rev; if ($("rev-cm")) $("rev-cm").value = ""; renderAll(); const ph = document.querySelector(".review"); if (ph && ph.getBoundingClientRect().top < 0) ph.scrollIntoView({ block: "start" }); return; }
    const mf = ev.target.closest("button[data-medfil]");
    if (mf) { medFiltro = mf.dataset.medfil; renderAll(); return; }
    const mp = ev.target.closest("button[data-medpide]");
    if (mp) { medPide = mp.dataset.medpide || null; renderAll(); const t = $("sol-txt"); if (t) t.focus(); return; }
    const se = ev.target.closest("button[data-solenviar]");
    if (se && db && canWrite && !busy) {
      const txt = (($("sol-txt") || {}).value || "").trim();
      if (!txt) { toast("Escribe qué debe hacer el agente."); return; }
      busy = true; const now = new Date().toISOString();
      try {
        await C("solicitudes").doc().set({ tipo: "medio", medio: se.dataset.solenviar, texto: txt, agente: "contenido", estado: "pendiente", fecha: now });
        await C("actividad").doc().set({ agente: "fundadora", accion: `Pidió un ajuste a Contenido: ${txt}`, pasa_a: "contenido", fecha: now });
        medPide = null; if ($("sol-txt")) $("sol-txt").value = ""; toast("Enviado. Contenido lo hace en Canva y te muestra el resultado aquí.");
      } catch (e) { toast("No se pudo enviar. Inténtalo de nuevo."); } finally { busy = false; renderAll(); }
      return;
    }
    const mb = ev.target.closest("button[data-medborrar]");
    if (mb && assets && db && canWrite && !busy) {
      const m = S.medios.find((x) => x._id === mb.dataset.medborrar);
      if (!m || !mb.dataset.ok) { medBorrar = m ? m._id : null; renderAll(); return; }
      busy = true;
      try {
        await D("medios/" + m._id).delete(); if (assetId(m.asset)) await assets.delete(m.asset);
        // Si un pedido pendiente al agente solo tenía este archivo, ya no hay nada que hacer
        for (const x of S.solicitudes.filter((y) => y.estado === "pendiente" && (y.medio === m._id || (y.medios || []).includes(m._id)))) {
          const resto = (x.medios || [x.medio]).filter((id) => id && id !== m._id);
          if (resto.length) await D("solicitudes/" + x._id).update({ medios: resto, medio: resto[0] });
          else await D("solicitudes/" + x._id).delete();
        }
        toast("Archivo quitado.");
      } catch (e) { toast("No se pudo quitar. Inténtalo de nuevo."); } finally { busy = false; medBorrar = null; renderAll(); }
      return;
    }
    const ra = ev.target.closest("button[data-revact]");
    if (ra && db && canWrite && !busy) {
      const act = ra.dataset.revact; const ahora = act === "aprobado" || !!ra.dataset.ahora; const p = S.propuestas.find((x) => x._id === revId); if (!p) return;
      const cm = (($("rev-cm") || {}).value || "").trim();
      if (act === "cambios" && !cm) { toast("Escribe qué cambiarías antes de pedir el cambio."); return; }
      busy = true; document.querySelectorAll("button[data-revact]").forEach((x) => (x.disabled = true));
      const now = new Date().toISOString();
      try {
        await D("propuestas/" + p._id).update({ revision: { estado: act, comentario: cm, fecha: now } });
        if (act === "cambios") await C("solicitudes").doc().set({ tipo: "post", propuesta: p._id, texto: cm, agente: "contenido", estado: "pendiente", fecha: now, urgente: ahora });
        await C("historial").doc().set({ fecha: now, proyecto: proyecto.id, agente: "contenido", tipo: "post", ref: p._id, titulo: `Post ${p.orden} · ${p.titulo_img || ""}`, resultado: { aprobado: "aprobada", cambios: "con_cambios", descartado: "rechazada" }[act], nota: cm, opcion: null, opcion_titulo: "", por: "fundadora" });
        await C("actividad").doc().set({ agente: "fundadora", accion: `${{ aprobado: "Aprobó", cambios: "Pidió cambios en", descartado: "Descartó" }[act]} el post ${p.orden} "${p.titulo_img}"${cm ? ": " + cm : ""}`, pasa_a: "contenido", tarea: "t-reel3", fecha: now });
        const yaVa = ahora && act !== "descartado" ? await despertarAgente() : false;
        toast(act === "descartado" ? "Post descartado."
          : yaVa ? (act === "aprobado" ? "Post aprobado. El agente ya lo está pasando a Metricool." : "Cambio enviado. El agente ya empezó; mira la barra.")
          : act === "aprobado" ? `Post aprobado. Pasa a Metricool ${proxRevision()}.` : `Cambio enviado. El agente lo toma ${proxRevision()}; la barra te muestra el avance.`);
        if (act !== "cambios") { const ps = S.propuestas.slice().sort((a, b) => (a.orden || 99) - (b.orden || 99)); const nxt = ps.find((x) => x._id !== p._id && !revOf(x)); if (nxt) revId = nxt._id; }
        if ($("rev-cm")) $("rev-cm").value = "";
      } catch (e) { toast("No se pudo guardar. Inténtalo de nuevo."); }
      finally { busy = false; renderAll(); }
      return;
    }
    const tb = ev.target.closest("[data-tab]");
    if (tb) { go(tb.dataset.tab); return; }
    const b = ev.target.closest("button[data-act]");
    if (b && db && canWrite && !busy) {
      const card = b.closest(".dcard"); const id = card.dataset.id; const act = b.dataset.act;
      const d = S.decisiones.find((x) => x._id === id); if (!d) return;
      const sel = card.querySelector("input[type=radio]:checked");
      const cm = ($("cm-" + id) || {}).value || "";
      if (act === "comentada" && !cm.trim()) { toast("Escribe el comentario antes de enviarlo."); return; }
      busy = true; card.querySelectorAll("button").forEach((x) => (x.disabled = true));
      const now = new Date().toISOString();
      try {
        await D("decisiones/" + id).update({ estado: act, respuesta: { opcion: act === "rechazada" ? null : (sel ? sel.value : null), comentario: cm.trim(), fecha: now } });
        const optT = sel ? ((d.opciones || []).find((o) => o.id === sel.value) || {}).titulo : "";
        const verbo = { aprobada: "Aprobó", rechazada: "Rechazó", comentada: "Comentó" }[act];
        await C("historial").doc().set({ fecha: now, proyecto: proyecto.id, agente: d.agente || null, tipo: "decision", ref: id, titulo: d.titulo || "", resultado: { aprobada: "aprobada", comentada: "con_cambios", rechazada: "rechazada" }[act], nota: cm.trim(), opcion: act === "rechazada" || !sel ? null : sel.value, opcion_titulo: act === "rechazada" ? "" : (optT || ""), por: "fundadora" });
        await C("actividad").doc().set({ agente: "fundadora", accion: `${verbo}: ${d.titulo}${act === "aprobada" && optT ? " (" + optT + ")" : ""}`, pasa_a: d.agente || null, tarea: d.tarea || null, decision: id, fecha: now });
        toast({ aprobada: "Aprobada. El agente ya puede seguir.", rechazada: "Rechazada. Quedó registrada.", comentada: "Comentario enviado al agente." }[act]);
      } catch (e) {
        toast(e && e.code === "invalid_argument" ? "Solo la fundadora puede responder decisiones." : "No se pudo guardar. Inténtalo de nuevo.");
        card.querySelectorAll("button").forEach((x) => (x.disabled = false));
      } finally { busy = false; }
      return;
    }
    const a = ev.target.closest("button[data-activar]");
    if (a && db && canWrite && !busy) {
      busy = true; a.disabled = true; const id = a.dataset.activar; const now = new Date().toISOString();
      try {
        await D("agentes/" + id).update({ solicitud: "activar", solicitud_fecha: now });
        await C("actividad").doc().set({ agente: "fundadora", accion: `Solicitó activar ${info(id).n}`, pasa_a: null, fecha: now });

    }
  });
  document.addEventListener("change", (ev) => {
    if (ev.target.id === "med-file") { subirMedios(ev.target.files); ev.target.value = ""; }
    if (ev.target.classList && ev.target.classList.contains("post-file")) { subirParaPost(ev.target.files, ev.target.dataset.post); ev.target.value = ""; }
    if (ev.target.id === "med-cat") medCat = ev.target.value;
    if (ev.target.id === "h-ag") { hAg = ev.target.value; renderAll(); }
    if (ev.target.id === "h-res") { hRes = ev.target.value; renderAll(); }
    if (ev.target.id === "h-desde") { hDesde = ev.target.value; renderAll(); }
  });
  ["dragover", "dragleave", "drop"].forEach((t) => document.addEventListener(t, (ev) => {
    const z = ev.target.closest && ev.target.closest("#med-drop, [data-postdrop]"); if (!z) return;
    ev.preventDefault(); z.classList.toggle("over", t === "dragover");

  /* ---------- Conexión con el tablero ---------- */
  function note(t) { const el = $("estado-db"); el.textContent = t; el.hidden = !t; }
  (async function boot() {
    if (!window.claude || !window.claude.use) { note("Abre esta página en Claude para ver el tablero en vivo."); return; }
    db = await window.claude.use("db");
    if (!db) { note("El tablero no está disponible en esta vista. Abre el Centro de mando desde Claude con tu cuenta."); return; }
    const user = await window.claude.use("user");
    try { const c = user ? await user.can("data.write") : null; canWrite = c === null ? true : !!c; } catch (e) { canWrite = true; }
    if (!canWrite) note("Estás viendo el Centro de mando en modo lectura.");
    window.claude.use("mcp").then((m) => { mcp = m; }, () => {});
    window.claude.use("assets").then((a) => { assets = a; assetsListo = true; if (loaded) renderAll(); }, () => { assetsListo = true; });
    let pending = 16; const ready = () => { if (pending > 0 && --pending === 0) { loaded = true; } if (loaded) renderAll(); };
    const sub = (path) => { let first = true; C(path).onSnapshot((snap) => { S[path] = snap.docs.filter((d) => d.exists).map((d) => Object.assign({ _id: d.id }, d.data())); if (first) { first = false; ready(); } else renderAll(); }, () => { if (first) { first = false; ready(); } }); };
    ["solicitudes", "medios", "propuestas", "tareas", "decisiones", "actividad", "mensajes", "calendario", "menu", "recetas", "proveedores", "cupos", "numeros", "agentes", "historial", "marca_comentarios"].forEach(sub);
    D("estrategia/actual").onSnapshot((d) => { S.estrategia = d.exists ? d.data() : null; if (loaded) renderAll(); }, () => {});
    D("marca/manual").onSnapshot((d) => { S.manual = d.exists ? d.data() : null; if (loaded) renderAll(); }, () => {});
    D("marca/board").onSnapshot((d) => { S.board = d.exists ? d.data() : null; if (loaded) renderAll(); }, () => {});
    D("semana/actual").onSnapshot((d) => { S.semana = d.exists ? d.data() : null; if (loaded) renderAll(); }, () => {});
  })();
})();
